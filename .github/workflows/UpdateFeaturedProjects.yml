name: Update Featured Projects

on:
  schedule:
    # 6時間ごとに実行
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-featured-projects:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: update-featured-projects
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch repos and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub REST API で公開リポジトリを取得
          REPOS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/users/DMARU9/repos?per_page=100&type=public")

          # fork と archived を除外し、stars 順→更新日順でソート、最大4件に制限
          # pushed_at は文字列なので fromdate で数値に変換してから否定
          TOP_REPOS=$(echo "$REPOS" | jq -r '
            [.[] | select(.fork == false and .archived == false)] |
            sort_by(-.stargazers_count, -(if .pushed_at then (.pushed_at | fromdate) else 0 end)) |
            .[0:4]
          ')

          # リポジトリ数を確認
          REPO_COUNT=$(echo "$TOP_REPOS" | jq 'length')

          if [ "$REPO_COUNT" = "0" ]; then
            CONTENT=""
          else
            # カラーサイクル
            COLORS=("#00C9FF" "#92FE9D" "#ff69b4")

            # テーブルヘッダーを生成
            CONTENT="<div align=\"center\">\n\n"
            CONTENT="${CONTENT}| Project | Stars |\n"
            CONTENT="${CONTENT}| :---: | :---: |\n"

            for i in $(seq 0 $((REPO_COUNT - 1))); do
              NAME=$(echo "$TOP_REPOS" | jq -r ".[$i].name")
              URL=$(echo "$TOP_REPOS" | jq -r ".[$i].html_url")
              STARS=$(echo "$TOP_REPOS" | jq -r ".[$i].stargazers_count")
              COLOR_IDX=$((i % 3))
              COLOR=${COLORS[$COLOR_IDX]}

              # リポジトリ名のハイフンを--でエスケープ（shields.ioルール）
              ESCAPED_NAME=$(echo "$NAME" | sed 's/-/--/g')

              # カラーの#を%23にエンコード
              ENCODED_COLOR=$(echo "$COLOR" | sed 's/#/%23/g')

              # バッジURLを生成（link=パラメータなし、Markdownリンクで実装）
              BADGE_URL="https://img.shields.io/badge/${ESCAPED_NAME}-${ENCODED_COLOR}?style=for-the-badge"

              # 1行=1プロジェクトのテーブル行を追加
              CONTENT="${CONTENT}| [![${NAME}](${BADGE_URL})](${URL}) | ⭐ ${STARS} |\n"
            done

            CONTENT="${CONTENT}\n</div>"
          fi

          # README.md を更新
          python3 -c "
          import re
          with open('README.md', 'r') as f:
              content = f.read()
          new_content = re.sub(
              r'<!--START_SECTION:featured_projects-->.*?<!--END_SECTION:featured_projects-->',
              '<!--START_SECTION:featured_projects-->\n${CONTENT}\n<!--END_SECTION:featured_projects-->',
              content,
              flags=re.DOTALL
          )
          with open('README.md', 'w') as f:
              f.write(new_content)
          "

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🚀 Update featured projects"
            git push
          fi
